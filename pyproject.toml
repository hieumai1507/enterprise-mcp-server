[project]
name = "enterprise-postgresql-mcp-server"
version = "1.0.0"
description = "Hardened, enterprise-grade Model Context Protocol server for PostgreSQL with OAuth 2.1, RBAC, and AI Guardrails"
authors = [{ name = "Enterprise Architecture Team", email = "sec-eng@enterprise.internal" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.0.0",
    "authlib>=1.3.1",
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "structlog>=24.4.0",
    "cachetools>=5.5.0",
    "sqlparse>=0.5.1",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "coverage>=7.6.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
